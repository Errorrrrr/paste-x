name: Release QA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-arm64
    steps:
      - name: Resolve tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Check version and source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$actual" == "$VERSION" ]] || { echo "Tag/version mismatch" >&2; exit 1; }
          test -f "docs/release/v$VERSION.md"

      - name: Test legacy migration and read-only guards
        run: swift test --disable-sandbox --filter 'legacyLibraryMigratesWithoutRemovingOriginalRecords|legacyPinboardsStayReadOnlyUntilSupported|olderSettingsWithoutNewFieldsPreserveHistoryAndExistingPreferences|corruptManifestIsPreservedAndBlocksWrites'

      - name: Build QA package
        run: SIGNING_MODE=qa ./scripts/build-macos.sh

      - name: Prepare release asset and notes
        id: asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="dist/PasteX-$VERSION-macos-arm64-qa-only.zip"
          cp dist/PasteX-macos-arm64-qa-only.zip "$asset"
          sha=$(shasum -a 256 "$asset" | awk '{print $1}')
          cp "docs/release/v$VERSION.md" "$RUNNER_TEMP/release-notes.md"
          printf '\n构建提交：`%s`。\n\n安装包 SHA-256：`%s`。\n' "$(git rev-parse HEAD)" "$sha" >> "$RUNNER_TEMP/release-notes.md"
          echo "path=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.asset.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "PasteX $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" "$ASSET" --title "PasteX $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
