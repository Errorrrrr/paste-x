name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

# Serialize all tags so an older build cannot race a newer release for latest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Resolve tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Check version and source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$actual" == "$VERSION" ]] || { echo "Tag/version mismatch" >&2; exit 1; }
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          [[ "$build" == "$VERSION" ]] || { echo "Tag/build version mismatch" >&2; exit 1; }
          test -s "docs/release/v$VERSION.md"

      - name: Test update detection and all regressions
        run: ./scripts/test-macos-ci.sh

      - name: Build release package
        run: SIGNING_MODE=adhoc ./scripts/build-macos.sh

      - name: Verify package and prepare release assets
        id: asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer_name="PasteX-$VERSION-macos-arm64.dmg"
          archive_name="PasteX-$VERSION-macos-arm64.zip"
          installer="dist/$installer_name"
          archive="dist/$archive_name"
          test -s dist/PasteX-macos-arm64.dmg
          test -s dist/PasteX-macos-arm64.zip
          cp dist/PasteX-macos-arm64.dmg "$installer"
          cp dist/PasteX-macos-arm64.zip "$archive"
          hdiutil verify "$installer"
          unzip -t "$archive"
          verify_dir=$(mktemp -d "$RUNNER_TEMP/pastex-package.XXXXXX")
          ditto -x -k "$archive" "$verify_dir"
          mount_dir=$(mktemp -d "$RUNNER_TEMP/pastex-installer.XXXXXX")
          cleanup_mount() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; }
          trap cleanup_mount EXIT
          hdiutil attach "$installer" -readonly -nobrowse -noautoopen -mountpoint "$mount_dir"
          [[ -L "$mount_dir/Applications" && "$(readlink "$mount_dir/Applications")" == /Applications ]]
          test -s "$mount_dir/安装说明.txt"
          for app in "$verify_dir/PasteX.app" "$mount_dir/PasteX.app"; do
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
            [[ "$actual" == "$VERSION" ]] || { echo "Packaged version mismatch" >&2; exit 1; }
            [[ "$(lipo -archs "$app/Contents/MacOS/PasteX")" == arm64 ]] || { echo "Packaged architecture mismatch" >&2; exit 1; }
            codesign --verify --deep --strict "$app"
          done
          cmp "$verify_dir/PasteX.app/Contents/MacOS/PasteX" "$mount_dir/PasteX.app/Contents/MacOS/PasteX"
          hdiutil detach "$mount_dir"
          trap - EXIT
          (cd dist && shasum -a 256 "$installer_name" > "$installer_name.sha256")
          (cd dist && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          installer_sha=$(shasum -a 256 "$installer" | awk '{print $1}')
          archive_sha=$(shasum -a 256 "$archive" | awk '{print $1}')
          cp "docs/release/v$VERSION.md" "$RUNNER_TEMP/release-notes.md"
          printf '\n构建提交：`%s`。\n\nDMG SHA-256：`%s`。\n\n兼容 ZIP SHA-256：`%s`。\n' "$(git rev-parse HEAD)" "$installer_sha" "$archive_sha" >> "$RUNNER_TEMP/release-notes.md"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.asset.outputs.installer }}
          ZIP: ${{ steps.asset.outputs.archive }}
        run: |
          # Publish only after the DMG and the legacy-client ZIP are both verified.
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [[ "$is_draft" == true ]] || { echo "Release $TAG is already public. Publish changes with a new version tag." >&2; exit 1; }
          else
            gh release create "$TAG" --draft --title "PasteX $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
          gh release upload "$TAG" "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" --clobber
          download_dir=$(mktemp -d "$RUNNER_TEMP/pastex-release.XXXXXX")
          gh release download "$TAG" --pattern "$(basename "$DMG")" --pattern "$(basename "$DMG").sha256" --pattern "$(basename "$ZIP")" --pattern "$(basename "$ZIP").sha256" --dir "$download_dir"
          for package in "$DMG" "$ZIP"; do
            checksum="$package.sha256"
            cmp "$checksum" "$download_dir/$(basename "$checksum")"
            (cd "$download_dir" && shasum -a 256 -c "$(basename "$checksum")")
          done

          # Explicitly keep an older tag rerun from becoming the newest update.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/published-tags.txt"
          make_latest=$(python3 - "$TAG" "$RUNNER_TEMP/published-tags.txt" <<'PY'
          import pathlib
          import re
          import sys

          def version(tag):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(map(int, match.groups())) if match else None

          target = version(sys.argv[1])
          published = [version(tag) for tag in pathlib.Path(sys.argv[2]).read_text().splitlines()]
          print("false" if any(v is not None and v > target for v in published) else "true")
          PY
          )
          gh release edit "$TAG" --draft=false --prerelease=false --latest="$make_latest" --title "PasteX $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
